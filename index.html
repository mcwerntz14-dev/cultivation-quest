<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cultivation Quest v0.1</title><style>body{margin:0;background:#101b22;color:#e8efdc;font-family:monospace;text-align:center}h1{font-size:22px;margin:12px}canvas{image-rendering:pixelated;width:min(96vw,960px);border:5px solid #667b64;background:#1b2930;touch-action:none}button{font:16px monospace;padding:12px;margin:3px;background:#314c44;color:white;border:2px solid #7b9b7c;border-radius:5px}#controls{max-width:960px;margin:auto}p{margin:7px}</style></head><body><h1>🌿 CULTIVATION QUEST <small>v0.1</small></h1><canvas id="game" width="800" height="512"></canvas><div id="controls"><button data-key="ArrowUp">▲</button><br><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button><button id="act">INTERACT / E</button><button id="back">BACK / ESC</button></div><p>Move: WASD / arrows • Interact: E • Close: Esc • Mobile: buttons</p><script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;const W=800,H=512,T=32;let keys={},mode='world',message='Welcome! Join the crew at the green workstations.',progress=0,sorted=0,removed=0,task='defol',items=[],frame=0;let player={x:4*T,y:8*T},npcs=[{x:9*T,y:6*T,name:'Rae',color:'#c67d50',phase:0},{x:16*T,y:10*T,name:'Jules',color:'#bfa0d2',phase:2},{x:19*T,y:6*T,name:'Sam',color:'#e1b668',phase:4}];let stations=[{x:10*T,y:5*T,type:'defol',name:'Plant Care'},{x:17*T,y:9*T,type:'sort',name:'Harvest Table'}];const rand=(a,b)=>a+Math.random()*(b-a);function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}function txt(s,x,y,c='#f6f4db',size=14){ctx.fillStyle=c;ctx.font=`bold ${size}px monospace`;ctx.fillText(s,x,y)}function plant(x,y,scale=1){rect(x-2*scale,y,4*scale,14*scale,'#866d48');for(let i=0;i<5;i++){let a=i*Math.PI*2/5;rect(x+Math.cos(a)*10*scale-6*scale,y+Math.sin(a)*9*scale-5*scale,12*scale,10*scale,i%2?'#45864d':'#68a95c')}rect(x-4*scale,y-4*scale,8*scale,8*scale,'#b2c96b')}
function worker(x,y,color,hat=false){rect(x+6,y+1,19,10,hat?'#e2d28b':'#4e3930');rect(x+8,y+8,15,13,color);rect(x+5,y+21,22,10,'#477e91');rect(x+6,y+30,8,3,'#20252d');rect(x+18,y+30,8,3,'#20252d');rect(x+9,y+12,3,3,'#23262c');rect(x+19,y+12,3,3,'#23262c')}
function world(){rect(0,0,W,H,'#263a3e');for(let y=0;y<H;y+=T)for(let x=0;x<W;x+=T){rect(x+1,y+1,30,30,(x/T+y/T)%2?'#33484a':'#354d4b');rect(x+3,y+3,3,3,'#3d5351')}rect(0,0,W,18,'#7e8c88');rect(0,0,16,H,'#7e8c88');rect(W-16,0,16,H,'#7e8c88');rect(0,H-16,W,16,'#7e8c88');for(let x=48;x<736;x+=92){rect(x,45,72,65,'#60736a');rect(x+5,50,62,55,'#394f40');plant(x+36,76,1.1)}for(let x=80;x<730;x+=110){rect(x,370,85,64,'#758074');rect(x+5,375,75,54,'#4d6351');plant(x+40,400,1.3)}rect(295,149,86,40,'#a9a18a');rect(302,155,72,27,'#596c50');plant(339,167,.75);rect(517,280,96,54,'#b2a184');rect(522,286,86,42,'#8c7656');for(let i=0;i<7;i++)rect(530+i*10,300+(i%3)*5,9,8,'#8cab69');for(let i=0;i<3;i++){rect(50+i*65,230,46,50,'#6b7d84');rect(54+i*65,236,38,38,'#a4b5b1')}npcs.forEach(n=>{let wob=Math.sin(frame/28+n.phase)*4;worker(n.x+wob,n.y,n.color,true);txt(n.name,n.x-3,n.y-6,'#f1e9c6',12)});worker(player.x,player.y,'#efaa70');stations.forEach(s=>{let dx=player.x-s.x,dy=player.y-s.y;if(Math.hypot(dx,dy)<70){rect(s.x-8,s.y-27,115,20,'#152b29');txt('E: '+s.name,s.x-4,s.y-12,'#f9e6a6',12)}});rect(0,0,W,33,'#142427');txt('SHIFT 1  |  TEAM WORK '+Math.floor(progress)+'%  |  TASKS '+(removed+sorted),15,22,'#e7eec9');rect(0,H-48,W,48,'#142427');txt(message.slice(0,93),15,H-20,'#f2ebcc',13)}
function begin(t){task=t;mode=t;removed=0;sorted=0;items=[];for(let i=0;i<12;i++)items.push({x:rand(95,700),y:rand(170,410),done:false,kind:Math.random()>.45?'bud':'leaf'});message=t==='defol'?'Click highlighted leaves to help the crew.':'Click loose buds to collect them.'}
function minigame(){rect(0,0,W,H,'#23343a');rect(20,45,760,420,'#697e70');rect(33,58,734,395,task==='defol'?'#405e4b':'#8c7355');rect(0,0,W,43,'#132628');txt(task==='defol'?'PLANT CARE — FIRST PERSON':'HARVEST TABLE — FIRST PERSON',20,28,'#f1ebc9',19);if(task==='defol'){rect(383,180,20,260,'#5c784b');for(let i=0;i<5;i++)plant(390,195+i*40,1.8);items.forEach(it=>{if(!it.done){rect(it.x-14,it.y-5,28,11,'#8ac95c');rect(it.x-5,it.y-15,10,30,'#a7df6c');rect(it.x-17,it.y-17,34,34,'#d8c56c');rect(it.x-14,it.y-14,28,28,'#5d9d4d')}})}else{rect(65,130,670,300,'#b3a085');items.forEach(it=>{if(!it.done){rect(it.x-12,it.y-10,25,21,'#507e43');rect(it.x-8,it.y-14,17,28,'#82a95c');rect(it.x-4,it.y-7,9,13,'#b9ba74')}})}rect(0,H-47,W,47,'#132628');txt('Completed: '+(task==='defol'?removed:sorted)+'/12    •    Click objects    •    Esc to return',18,H-18,'#f3eacb',15)}
function act(){if(mode!=='world'){mode='world';message='Back on the floor. Your coworkers keep working.';return}let s=stations.find(s=>Math.hypot(player.x-s.x,player.y-s.y)<75);if(s)begin(s.type);else message='Walk near a workstation and press E to join the crew.'}function clickGame(e){if(mode==='world'){act();return}let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;let it=items.find(o=>!o.done&&Math.hypot(x-o.x,y-o.y)<27);if(it){it.done=true;if(task==='defol')removed++;else sorted++;progress=Math.min(100,progress+2);if(items.every(i=>i.done)){mode='world';message='Great work! You finished a station task alongside the crew.'}}}
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==='e')act();if(e.key==='Escape'&&mode!=='world')act()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key.toLowerCase();b.addEventListener('pointerdown',e=>{e.preventDefault();keys[k]=true});['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,()=>keys[k]=false))});document.getElementById('act').onclick=act;document.getElementById('back').onclick=()=>{if(mode!=='world')act()};canvas.addEventListener('pointerdown',clickGame);let last=0;function loop(t){let dt=Math.min((t-last)/16.67||1,2);last=t;frame+=dt;if(mode==='world'){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0),dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0),len=Math.hypot(dx,dy)||1;player.x=Math.max(20,Math.min(W-52,player.x+dx/len*2.5*dt));player.y=Math.max(38,Math.min(H-82,player.y+dy/len*2.5*dt));progress=Math.min(100,progress+.007*dt);world()}else minigame();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
