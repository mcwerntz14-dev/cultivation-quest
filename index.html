<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cultivation Quest v0.3</title><style>body{margin:0;background:#101b22;color:#e8efdc;font-family:monospace;text-align:center}h1{font-size:22px;margin:12px}canvas{image-rendering:pixelated;width:min(96vw,960px);border:5px solid #667b64;background:#1b2930;touch-action:none}button{font:16px monospace;padding:12px;margin:3px;background:#314c44;color:white;border:2px solid #7b9b7c;border-radius:5px;touch-action:none;user-select:none;-webkit-user-select:none}#controls{max-width:960px;margin:10px auto;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:0 16px;box-sizing:border-box}#controls{background:#34363d;border:3px solid #656772;border-radius:32px;padding:16px 22px;box-shadow:inset 0 4px #555762,0 8px 0 #101116;touch-action:none}.stick-shell{width:158px;height:158px;border-radius:50%;background:#1d2028;border:7px solid #777983;box-sizing:border-box;position:relative;flex-shrink:0;touch-action:none;box-shadow:inset 0 0 0 5px #292d36,inset 0 5px 12px #090a0c;user-select:none}.stick-ring{position:absolute;inset:19px;border:2px solid #4d515d;border-radius:50%;pointer-events:none}.stick-knob{position:absolute;left:50%;top:50%;width:67px;height:67px;margin:-33.5px 0 0 -33.5px;border-radius:50%;background:radial-gradient(circle at 35% 28%,#777b87,#3c404b 65%,#22252c);border:4px solid #999ca5;box-sizing:border-box;box-shadow:0 5px 9px #090a0c;pointer-events:none;transform:translate(0px,0px)}.stick-label{font-size:11px;letter-spacing:2px;color:#c9cad1;margin-top:6px}.stick-area{display:flex;flex-direction:column;align-items:center}.actions{transform:rotate(-17deg)}.actions button{transform:rotate(17deg);box-shadow:inset 0 -5px #25212a,0 3px 3px #1d1c22}.actions #act{background:#a83c52}.actions #back{background:#4a649c}@media(max-width:440px){.stick-shell{width:134px;height:134px}.stick-knob{width:60px;height:60px;margin:-30px 0 0 -30px}#controls{padding:12px 10px;gap:7px}.actions button{width:61px;height:61px;font-size:11px}}.actions{display:flex;gap:10px;align-items:center;justify-content:center;flex-wrap:wrap}.actions button{border-radius:50%;width:76px;height:76px;font-size:13px;font-weight:bold;margin:0}.actions #act{background:#8c4b48}.actions #back{background:#465a85}p{margin:7px}</style></head><body><h1>🌿 CULTIVATION QUEST <small>v0.3</small></h1><canvas id="game" width="800" height="512"></canvas><div id="controls"><div class="stick-area"><div class="stick-shell" id="stick" aria-label="Analog movement joystick"><div class="stick-ring"></div><div class="stick-knob" id="knob"></div></div><div class="stick-label">MOVE</div></div><div class="actions"><button id="back">B<br>BACK</button><button id="act">A<br>ACTION</button></div></div><p>Move: WASD / arrows • Interact: E • Close: Esc • Mobile: analog thumbstick + A/B</p><script>
let analog={x:0,y:0};const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;const W=800,H=512,T=32;let keys={},mode='world',message='Welcome! Join the crew at the green workstations.',progress=0,sorted=0,removed=0,task='defol',items=[],frame=0;let player={x:4*T,y:8*T},npcs=[{x:9*T,y:6*T,name:'Rae',color:'#c67d50',phase:0},{x:16*T,y:10*T,name:'Jules',color:'#bfa0d2',phase:2},{x:19*T,y:6*T,name:'Sam',color:'#e1b668',phase:4}];let stations=[{x:10*T,y:5*T,type:'defol',name:'Plant Care'},{x:17*T,y:9*T,type:'sort',name:'Harvest Table'}];const rand=(a,b)=>a+Math.random()*(b-a);function rect(x,y,w,h,c){ctx.fillStyle=c;ctx.fillRect(Math.round(x),Math.round(y),w,h)}function txt(s,x,y,c='#f6f4db',size=14){ctx.fillStyle=c;ctx.font=`bold ${size}px monospace`;ctx.fillText(s,x,y)}function plant(x,y,scale=1){rect(x-2*scale,y,4*scale,14*scale,'#866d48');for(let i=0;i<5;i++){let a=i*Math.PI*2/5;rect(x+Math.cos(a)*10*scale-6*scale,y+Math.sin(a)*9*scale-5*scale,12*scale,10*scale,i%2?'#45864d':'#68a95c')}rect(x-4*scale,y-4*scale,8*scale,8*scale,'#b2c96b')}
function worker(x,y,color,hat=false){rect(x+6,y+1,19,10,hat?'#e2d28b':'#4e3930');rect(x+8,y+8,15,13,color);rect(x+5,y+21,22,10,'#477e91');rect(x+6,y+30,8,3,'#20252d');rect(x+18,y+30,8,3,'#20252d');rect(x+9,y+12,3,3,'#23262c');rect(x+19,y+12,3,3,'#23262c')}
function world(){rect(0,0,W,H,'#263a3e');for(let y=0;y<H;y+=T)for(let x=0;x<W;x+=T){rect(x+1,y+1,30,30,(x/T+y/T)%2?'#33484a':'#354d4b');rect(x+3,y+3,3,3,'#3d5351')}rect(0,0,W,18,'#7e8c88');rect(0,0,16,H,'#7e8c88');rect(W-16,0,16,H,'#7e8c88');rect(0,H-16,W,16,'#7e8c88');for(let x=48;x<736;x+=92){rect(x,45,72,65,'#60736a');rect(x+5,50,62,55,'#394f40');plant(x+36,76,1.1)}for(let x=80;x<730;x+=110){rect(x,370,85,64,'#758074');rect(x+5,375,75,54,'#4d6351');plant(x+40,400,1.3)}rect(295,149,86,40,'#a9a18a');rect(302,155,72,27,'#596c50');plant(339,167,.75);rect(517,280,96,54,'#b2a184');rect(522,286,86,42,'#8c7656');for(let i=0;i<7;i++)rect(530+i*10,300+(i%3)*5,9,8,'#8cab69');for(let i=0;i<3;i++){rect(50+i*65,230,46,50,'#6b7d84');rect(54+i*65,236,38,38,'#a4b5b1')}npcs.forEach(n=>{let wob=Math.sin(frame/28+n.phase)*4;worker(n.x+wob,n.y,n.color,true);txt(n.name,n.x-3,n.y-6,'#f1e9c6',12)});worker(player.x,player.y,'#efaa70');stations.forEach(s=>{let dx=player.x-s.x,dy=player.y-s.y;if(Math.hypot(dx,dy)<70){rect(s.x-8,s.y-27,115,20,'#152b29');txt('E: '+s.name,s.x-4,s.y-12,'#f9e6a6',12)}});rect(0,0,W,33,'#142427');txt('SHIFT 1  |  TEAM WORK '+Math.floor(progress)+'%  |  TASKS '+(removed+sorted),15,22,'#e7eec9');rect(0,H-48,W,48,'#142427');txt(message.slice(0,93),15,H-20,'#f2ebcc',13)}
function begin(t){task=t;mode=t;removed=0;sorted=0;items=[];for(let i=0;i<12;i++)items.push({x:rand(95,700),y:rand(170,410),done:false,kind:Math.random()>.45?'bud':'leaf'});message=t==='defol'?'Click highlighted leaves to help the crew.':'Click loose buds to collect them.'}
function minigame(){rect(0,0,W,H,'#23343a');rect(20,45,760,420,'#697e70');rect(33,58,734,395,task==='defol'?'#405e4b':'#8c7355');rect(0,0,W,43,'#132628');txt(task==='defol'?'PLANT CARE — FIRST PERSON':'HARVEST TABLE — FIRST PERSON',20,28,'#f1ebc9',19);if(task==='defol'){rect(383,180,20,260,'#5c784b');for(let i=0;i<5;i++)plant(390,195+i*40,1.8);items.forEach(it=>{if(!it.done){rect(it.x-14,it.y-5,28,11,'#8ac95c');rect(it.x-5,it.y-15,10,30,'#a7df6c');rect(it.x-17,it.y-17,34,34,'#d8c56c');rect(it.x-14,it.y-14,28,28,'#5d9d4d')}})}else{rect(65,130,670,300,'#b3a085');items.forEach(it=>{if(!it.done){rect(it.x-12,it.y-10,25,21,'#507e43');rect(it.x-8,it.y-14,17,28,'#82a95c');rect(it.x-4,it.y-7,9,13,'#b9ba74')}})}rect(0,H-47,W,47,'#132628');txt('Completed: '+(task==='defol'?removed:sorted)+'/12    •    Click objects    •    Esc to return',18,H-18,'#f3eacb',15)}
function act(){if(mode!=='world'){mode='world';message='Back on the floor. Your coworkers keep working.';return}let s=stations.find(s=>Math.hypot(player.x-s.x,player.y-s.y)<75);if(s)begin(s.type);else message='Walk near a workstation and press E to join the crew.'}function clickGame(e){if(mode==='world'){act();return}let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;let it=items.find(o=>!o.done&&Math.hypot(x-o.x,y-o.y)<27);if(it){it.done=true;if(task==='defol')removed++;else sorted++;progress=Math.min(100,progress+2);if(items.every(i=>i.done)){mode='world';message='Great work! You finished a station task alongside the crew.'}}}
window.addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==='e')act();if(e.key==='Escape'&&mode!=='world')act()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);const stick=document.getElementById('stick'),knob=document.getElementById('knob');let activePointer=null;function moveStick(e){const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,max=(r.width-70)/2;let x=e.clientX-cx,y=e.clientY-cy,len=Math.hypot(x,y);if(len>max){x=x/len*max;y=y/len*max}knob.style.transform=`translate(${x}px,${y}px)`;analog.x=x/max;analog.y=y/max;if(Math.hypot(analog.x,analog.y)<.12){analog.x=0;analog.y=0}}function releaseStick(e){if(activePointer!==null&&(!e||e.pointerId===activePointer)){activePointer=null;analog.x=analog.y=0;knob.style.transform='translate(0px,0px)'}}stick.addEventListener('pointerdown',e=>{e.preventDefault();if(activePointer!==null)return;activePointer=e.pointerId;stick.setPointerCapture(e.pointerId);moveStick(e)});stick.addEventListener('pointermove',e=>{if(e.pointerId===activePointer){e.preventDefault();moveStick(e)}});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>stick.addEventListener(ev,releaseStick));window.addEventListener('blur',()=>{releaseStick();keys={}});document.getElementById('act').onclick=act;document.getElementById('back').onclick=()=>{if(mode!=='world')act()};canvas.addEventListener('pointerdown',clickGame);let last=0;function loop(t){let dt=Math.min((t-last)/16.67||1,2);last=t;frame+=dt;if(mode==='world'){let dx=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0)+analog.x,dy=(keys.s||keys.arrowdown?1:0)-(keys.w||keys.arrowup?1:0)+analog.y,len=Math.max(1,Math.hypot(dx,dy));player.x=Math.max(20,Math.min(W-52,player.x+dx/len*2.5*dt));player.y=Math.max(38,Math.min(H-82,player.y+dy/len*2.5*dt));progress=Math.min(100,progress+.007*dt);world()}else minigame();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script></body></html>
